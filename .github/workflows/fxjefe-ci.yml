name: FXJEFE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
      - name: Install pipeline dependencies except MetaTrader5
        run: |
          python -m pip install -U pip
          grep -vi -e '^MetaTrader5' -e '^#' requirements.txt | python -m pip install -r /dev/stdin
      - name: Syntax and pipeline tests
        run: |
          python -m compileall -q -f .
          python -m unittest discover -s tests -v
          python -c "import run_pipeline; stages=run_pipeline.load_manifest(); assert len(stages)==17; print('stages', len(stages))"
